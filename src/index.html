<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#edf0d9" />
    <meta
      name="description"
      content="送几封信，认识林间的朋友，慢慢把小屋布置成家。一个随时停下、每步保存的轻探索小游戏。"
    />
    <title>苔光来信 · Mosslight Post</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232c493a'/%3E%3Cpath d='M13 22h38v26H13z' fill='%23edf0d9'/%3E%3Cpath d='m13 22 19 15 19-15' fill='none' stroke='%232c493a' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="masthead">
        <a class="wordmark" href="./" aria-label="苔光来信首页"
          ><span class="brand-icon" aria-hidden="true">✉</span
          ><span>苔光来信<small>MOSSLIGHT POST</small></span></a
        >
        <div class="top-actions">
          <button
            id="music-toggle"
            class="icon-button"
            aria-label="开启音乐"
            title="开启音乐"
          >
            ♫<span id="music-label">音乐关</span></button
          ><button id="settings-open" class="icon-button" aria-label="打开设置">
            ☰<span>设置</span>
          </button>
        </div>
      </header>
      <div id="save-warning" class="save-warning" hidden></div>
      <main id="game" aria-label="苔光来信游戏">
        <section class="scene-column" aria-label="林间小屋与路线">
          <div class="scene-heading">
            <div>
              <span class="eyebrow" id="scene-eyebrow">溪边的一隅</span>
              <h1 id="scene-title">今天，也慢慢来。</h1>
            </div>
            <span id="scene-badge" class="scene-badge">常青小院</span>
          </div>
          <div class="scene-frame">
            <canvas
              id="world"
              width="864"
              height="864"
              aria-label="林间小屋场景"
            ></canvas>
            <div id="scene-targets" class="scene-targets"></div>
            <div id="scene-note" class="scene-note"></div>
          </div>
          <div class="scene-footer">
            <span id="scene-caption">信会送到，路也会等你。</span
            ><button id="postcard" class="text-button">保存小院图片 ↗</button>
          </div>
        </section>
        <section class="journal" aria-label="旅途手记">
          <nav class="tabs" aria-label="游戏页面">
            <button data-tab="home" aria-current="page">小屋</button
            ><button data-tab="letters">
              来信<span id="new-letter-dot" class="dot"></span></button
            ><button data-tab="friends">伙伴</button
            ><button data-tab="decor">布置</button>
          </nav>
          <div id="panel" class="panel" tabindex="-1">
            <p class="loading">正在打开林间小屋……</p>
          </div>
        </section>
      </main>
      <footer class="site-footer">
        <span id="save-status">每一步，自动保存在此浏览器</span
        ><span
          ><a href="https://foreseer.site/myweb" target="_blank" rel="noopener"
            >4c / MyWeb ↗</a
          ><button id="credits-open" class="text-button">素材鸣谢</button></span
        >
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="modal">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon-button" aria-label="关闭弹窗">
          ✕
        </button>
      </div>
      <div id="modal-content"></div>
    </dialog>
    <input
      type="file"
      id="import-file"
      accept="application/json,.json"
      hidden
    />
    <noscript
      >请允许 JavaScript 来开启游戏。所有进度保存在你自己的浏览器。</noscript
    >
    <script type="module" src="./app.js"></script>
  </body>
</html>
