</style><main><header><small>仅用于规则验证 · 不代表最终画面</small><h1>12 手，留下一座小庭院</h1><p>选一张地貌，再选空格查看变化。结算时仍满足条件的伙伴会留下。</p></header><div class="controls"><select id="scenario" aria-label="场景"></select><button id="restart">下一组种子</button><button id="undo">撤销</button><button id="reroll">换牌</button></div><div class="layout"><section><div id="board" class="board"></div><div id="cards" class="cards"></div><div class="preview"><div id="preview">先选择一张地貌。</div><button id="confirm" disabled>放在这里</button></div><p id="status" role="status"></p></section><aside><p id="turn"></p><p id="scenario-note"></p><div id="goals" class="goals"></div></aside></div><p class="note">相邻指上下左右。以上是游戏配方，不是生态科普。没有计时、喂养与离线惩罚。实验检查：早期固定模板、冲突可读性、换牌是否必要、手机点击尺寸。</p></main><script type="module" src="mechanics-lab.js"></script></html>
