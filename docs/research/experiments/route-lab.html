<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>林间来信 · 路线原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#ecebdb;color:#304c3e;font:15px/1.6 system-ui,sans-serif}main{max-width:1060px;margin:auto;padding:24px 18px}h1{font-size:30px;margin:4px 0}h2{font-size:19px;margin:0 0 10px}p{margin:6px 0}button,select{font:inherit;min-height:44px;border:1px solid #a6b49c;border-radius:8px;padding:9px 14px;color:inherit;background:#fbfbef;cursor:pointer}button:disabled{opacity:.45;cursor:default}button[aria-pressed=true]{background:#355343;color:#fffce8}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.panel{background:#faf8ea;padding:20px;border:1px solid #cad0b8;border-radius:14px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{display:block;text-align:left}.tool strong,.tool small{display:block}.tool small{font-size:12px;line-height:1.5;margin-top:4px}.slots{display:flex;gap:5px;margin:15px 0}.slots span{width:25px;height:10px;border:1px solid #6e886d}.slots .full{background:#6e886d}#start{background:#345443;color:#fffce8;width:100%;margin-top:16px}.routes{display:grid;gap:10px}.route{text-align:left;min-height:85px}.route strong,.route small{display:block}.route small{font-size:12px}.badge{color:#8b6545;font-size:12px}.status{min-height:24px;color:#a1492c}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px 4px;border-bottom:1px solid #dfe1cb;text-align:left}details{margin-top:24px}summary{cursor:pointer;min-height:44px;padding:9px 0;font-weight:600}.history{font-size:13px;color:#69775e;padding-left:20px}.eyebrow,footer{font-size:11px;color:#849279}footer{margin-top:24px}#outcome{padding:14px;border-left:3px solid #6b8a55;background:#e6ead5}#restart,#undo{margin-top:15px}#current{font-size:23px;font-weight:600}#routes .route:focus-visible{outline:3px solid #ac7043} @media(max-width:700px){main{padding:18px 12px}.layout{grid-template-columns:1fr;gap:14px}.panel{padding:16px}.tool{font-size:14px}h1{font-size:27px}table{font-size:11px}}
</style><main><div class="eyebrow">CORE LOOP STUDY · 仅规则对照</div><h1>带一封信，去林间走走。</h1><p>四格行囊。途中见谁、带回什么，由这次的准备决定。</p><div class="top"><label>路线 <select id="case"></select></label><span id="description"></span></div><div class="layout"><section class="panel"><h2>出发前 · 看地图，装行囊</h2><div class="slots" id="slots" aria-label="行囊占用"></div><div class="tools" id="tools"></div><button id="start">带好信出发</button><p class="status" id="status" role="status"></p><details open><summary>全部路段与确定结果</summary><table><thead><tr><th>路段</th><th>精力</th><th>条件 / 收获</th></tr></thead><tbody id="map"></tbody></table></details></section><section class="panel"><div id="current">还在小屋</div><p class="badge" id="energy">精力仅用于本趟，回家后不计分。</p><div id="routes" class="routes"></div><div id="outcome" hidden></div><button id="undo" disabled>退回上个路口</button> <button id="restart">重新准备</button><h2 style="margin-top:24px">路上发生了什么</h2><ol id="history" class="history"></ol></section></div><footer>没有真实时间等待、战斗或产币。当前纪念物仅为结果标签，长期成长尚未实现；原型不代表最终画面。</footer></main><script type="module" src="route-lab.js"></script></html>
